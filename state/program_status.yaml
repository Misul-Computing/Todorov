  run_011: "full architecture (KDA+Mamba3+MLA, 6:1:1), H200, 280M, BPB 2.592, ratio 0.722x, 3/4 gates pass (FR measurement bug from gradient checkpointing)"
  god_run: "god_machine.py first run, all 5 blueprint features + imagination probe + PC diagnostic, H200, 283M, fineweb-edu 131M tokens, val_bpb 1.3950 (0.390x vs transformer baseline), RETRIEVAL FAILED (passkey 0.0% at 256/1024/4096, selective_copy 0.0% at 256/512/1024/2048), delta_state_structure_probe mean_structure_ratio=0.981 with pairwise_cos -0.003 (state is noise not content-addressable), telemetry bug lost 40+ probe keys fixed post-hoc"
  god_run_v2: "god_machine.py re-run with 17 F + 14 G prosecutor fixes including critical F1 torch.exp math correction, H200, 283M, fineweb-edu 131M tokens, 59 min, val_bpb 1.4453 (+0.050 vs v1, 0.404x baseline), RETRIEVAL STILL 0 (passkey 0/100 CI 3.7% at 256/1024/4096, copy 0/100 at 256/512/1024/2048), delta_state_structure_probe mean_structure_ratio 0.977 pairwise_cos 0.003 (noise), F1 math fix NOT the root cause. bundle-is-broken confirmed. external review identified 8 candidate contributing mechanisms: k-WTA on keys likely destroys address space (strongest finding), erasure with sparse keys likely leaves ghost content (strongest finding), imagination probe gradient bypass, slow BCM EMA, multi-compartment effective-width loss, PC head loss drag, FLA/recurrent numerical drift, q/k normalization timing mismatch"
  run2_slot_memory: "first slot-memory paid run, 2026-04-15, H200, 355M, fineweb-edu, val_bpb 1.5107, passkey 0/100 at 256/1024/4096, copy 0/100. slot substrate replaced delta layers but preset INHERITED alpha_log_mean=-0.5 from Config defaults reproducing the exact state-evaporation bug documented in linear_attention_retrieval_wall.md. retention bug not substrate, run mismeasured. fix in commit 7abb781. mistake doc wiki/mistakes/run2_slot_memory_decay_copy_paste.md."
  run2_slot_memory_retention_fixed: "second slot-memory paid run, 2026-04-15, H200, 355M, fineweb-edu, 4000 steps in 72 min at 33000 tok/s, val_bpb 1.4777 (best), partial eval reported passkey 0/100 at 256 and 1024 before user halted pod. alpha_log_mean=5.0 explicit, FLA actually active (commit edcfe5d pinned flash-linear-attention after first launch attempt fell through to python recurrent loop). FIVE consecutive paid runs at 0% passkey across two substrates and two retention regimes. diagnosis reframed: the language-modelling training objective on fineweb-edu does not exercise the memory substrate, so gradient descent collapses it to inactive (mean gate 0.018 throughout). cpu gates A and B prove the substrate works in isolation. analysis at wiki/synthesis/training_objective_vs_architectural_goal.md, run card at neuroloc/wiki/tests/run2_slot_memory_retention_fixed_results.md."
  run3_cognition_phase1: "sixth paid run, 2026-04-17, H200, 355M, synthetic cognition corpus (50% passkey / 30% kv recall / 20% copy, hex ASCII alphabet, from neuroloc/data/cognition_corpus.py), 4000 steps in 72 min at 32800 tok/s, val_bpb 6.3519 (best, plateaued at alphabet prior from step 150 and never descended), passkey 0/100 at 256 and 1024 in partial eval before user halted pod. this was the predicted discriminant from training_objective_vs_architectural_goal.md: on a corpus where retrieval is explicit 50% of training, the substrate still did not learn retrieval within 4000 steps at 355M params. the architecture-cannot-be-trained-by-sgd branch fires. any future paid-resume path requires architectural intervention, not just a different corpus, and is now blocked behind the neural-model research/test-material plan. see wiki/synthesis/substrate_requires_architectural_change.md for the ranked candidate list (output gate init, auxiliary retrieval loss, orthogonal keys, hand-placed-address warm start, substrate replacement). run card at wiki/tests/run3_cognition_phase1_results.md."
  v0_1_descent_memory_toy: "architecture side-session, 2026-06-02, user-authorized (overriding no-paid state), personal runpod h200, toy ~4.2M params. clean test-gated descent-memory codebase built from scratch (git branch v0.1, dir v01/). candidate E (test-time gradient / descent memory) made numerically stable (nlms + bounded inner lr + hard state-norm clamp) but learns at chance on mqar; linear delta control also at chance; 4-layer attention solves passkey/induction at exact_acc 1.000 (n=100, wilson 95% lower bound 0.963). seven implementation bugs caught by sanity gates + telemetry. no 100m run. run card neuroloc/wiki/tests/v0_1_descent_memory_toy_results.md."
  candidate_f_affect_gated_write: "cpu-only experiment, 2026-06-10, no paid compute. executed the pre-registered candidate F (route inner-loop prediction-error magnitude into the descent memory's write gain) on the v01/ mlp substrate on mqar. CLOSED NEGATIVE: true surprise at chance under the own-history normaliser (affect 0.5 and 1.0) and under exact budget matching (realised write gain 1.000); surprise content is inert on the write side. the shuffled-surprise control ignited the first sgd-trained non-chance retrieval on this substrate (mqar exact 0.360 / token 0.785 at 1200 steps, seed 0, n=100; memory-mediated per a pinned no-write baseline; causal max_diff 0.0) but ignition is seed-sensitive (chance at seed 1) and not reproduced by uniform head-iid (token 0.098) or token-correlated (chance) noise at matched init/data. candidate F retired; anomaly promoted to candidate G (stochastic write gain, backlog, pre-registration + literature check required). supporting cpu context: linear matrix memory trains into partial mqar natively (exact 0.470 at 6 pairs / 400 steps; cliff at 10 is optimization not capacity), 4-layer attention reference at chance through 2000 steps. run card neuroloc/wiki/tests/affect_gated_write_cpu_experiment.md (frozen), bench v01/feel_tests.md."
