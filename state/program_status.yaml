test_status_note: "2026-05-07 focused validation passed 26 compression-mirror tests, 27 compression/registry tests, and 38 targeted compression/registry/hard-symbolic tests after adding the factor-heldout local falsification gate. pytest collection reports 336 tests. original sparse read solves state/action/joint success at 1.0 by selecting two legal observation records but commits 40 bits and is not within the compact-code budget; matched-budget sparse read commits 20 bits and fails. the distributed-evidence probe is solved by four-record sparse read at 80 bits and fails under matched budget at 20 bits. the ordinary-split tiny distributed local model has 25,975 parameters and reaches test joint/state/action success 1.0 at 19 committed bits, but the factor-heldout gate fails: validation joint success 0.1875, test joint success 0.03125, learned-code/oracle-decoder test joint success 0.046875, oracle-code/learned-decoder test joint success 0.4375, engineering pass 0.0. this is local symbolic evidence only, not paid compute or full-model evidence."
related_work_update: "2026-05-06 subq / selective sparse attention public material recorded at neuroloc/wiki/synthesis/content_routed_sparse_read_prior.md. validates content-dependent sparse read and functional context as prior-art pressure, does not prove memory-object compression, and adds content-routed sparse read over verbatim context as a future baseline where fair. no paid compute authorized."
related_work_pressure_matrix: "2026-05-06 six-lane literature pass consolidated at neuroloc/wiki/synthesis/neural_model_related_work_pressure_matrix.md. external work covers local state, fast weights, differentiable memory, sparse routing, task-relative compression, context compression, replay, world models, simulator gates, and oracle evaluation methods. remaining project edge is a compound proof of learned operation-preserving memory objects under exact controls. no paid compute authorized."
critical_fix: "god_machine.py step logger hardcoded dict dropped 40+ probe metrics, fixed class-wide via merge loop and smoke-test disk round-trip guard; bcm train/eval path divergence fixed by aligning recurrent path to running_state_norm; running_state_norm now training-only mutation; 17 prosecutor findings F1-F17 all fixed"
