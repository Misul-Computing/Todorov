  run_002: Phase 1, parallel KDA, 500 steps, BPB 2.876, MI 1.275, CKA 0.913 (ALL PASS)
  run_003: Phase 2 probe, passkey 0%, perplexity +12% at 4K (state bug)
  run_004: Progressive 256->1024, O(T^2) too slow, cancelled
  run_005: fla first attempt, FP32 slow, 10min JIT
  run_006: FP16 fix, stopped by user
  run_007: hybrid threshold, stopped by user
